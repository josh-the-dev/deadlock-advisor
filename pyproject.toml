[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlock-advisor"
version = "0.1.0"
description = "On-screen item draft advisor for Deadlock's Street Brawl mode (external, read-only overlay)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mss>=10.2",
    "numpy>=2.0",
    "opencv-python>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["advisor", "cli", "data", "detect", "overlay"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: needs deadlock-api.com or previously cached assets"]
